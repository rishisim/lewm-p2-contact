[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lewm-research"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "stable-worldmodel[train,env,format]==0.1.1",
  "typer==0.19.2",
  "scipy==1.14.1",
  "scikit-learn==1.7.2",
  "pyarrow==20.0.0",
]

[project.scripts]
lewm = "lewm_research.cli:app"

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
exclude-dependencies = ["decord"]

[tool.hatch.build.targets.wheel]
packages = ["src/lewm_research"]

[tool.hatch.build.targets.wheel.force-include]
"lewm_storage.py" = "lewm_storage.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
